server.port=8081

spring.application.name=meta-whatsapp-simulator
spring.main.banner-mode=off

logging.file.path=/var/log/metawhatsapp

# Supported Graph API versions
simulator.api-version.supported=v20.0,v21.0,v22.0,v23.0
simulator.api-version.latest=v23.0

# Bearer tokens
simulator.auth.valid-tokens=EAAGm0PX4ZCpsBA_SIMULATOR_STATIC_TOKEN
simulator.auth.verify-token=SIMULATOR_VERIFY_TOKEN

# Sender Routes
simulator.webhook.sender-routes.919691926477=https://testqa.gtsstaging.com/api/whatsapp/call-back/c0ffee00-51m0-4a7a-9e01-000000000001
simulator.webhook.sender-routes.919691926488=https://user.gtsstaging.com/api/whatsapp/call-back/c0ffee00-51m0-4a7a-9e01-000000000001
simulator.webhook.sender-routes.919691926499=https://user1.gtsstaging.com/api/whatsapp/call-back/c0ffee00-51m0-4a7a-9e01-000000000001
simulator.webhook.sender-routes.919691926138=https://user2.gtsstaging.com/api/whatsapp/call-back/c0ffee00-51m0-4a7a-9e01-000000000001
simulator.webhook.default-callback-url=https://dlr-reciever.onrender.com/api/whatsapp/call-back/c0ffee00-51m0-4a7a-9e01-000000000001
simulator.webhook.whatsapp-business-account-id=102934821739482
simulator.webhook.timeout-seconds=5
simulator.webhook.retry.max-attempts=3
simulator.webhook.retry.backoff-seconds=1,2,5

# Delays
simulator.delays.sent-seconds=2
simulator.delays.delivered-seconds=5
simulator.delays.read-seconds=10

# Events
simulator.events.sent-enabled=true
simulator.events.delivered-enabled=true
simulator.events.read-enabled=false

# Probability
simulator.probability.delivered=98
simulator.probability.failed=1
simulator.probability.expired=1

# Phone Identity
simulator.phone-number.display-phone-number=15550001111
simulator.phone-number.phone-number-id=109876543210987

# Virtual Threads
spring.threads.virtual.enabled=true

# High Concurrency Tomcat Tuning
server.tomcat.threads.max=1000
server.tomcat.threads.min-spare=200
server.tomcat.accept-count=10000
server.tomcat.max-connections=30000
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=120000
server.tomcat.max-keep-alive-requests=-1